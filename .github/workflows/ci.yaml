name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # protobuf-compiler provides protoc and protobuf-compiler-grpc the
          # grpc_cpp_plugin that protoc invokes for --grpc_out; the -dev packages
          # and pkg-config are what the Makefile discovers the flags through.
          sudo apt-get install -y g++ make libgtest-dev pkg-config \
            protobuf-compiler protobuf-compiler-grpc \
            libprotobuf-dev libgrpc++-dev

      - name: Show toolchain versions
        run: |
          g++ --version | head -1
          protoc --version
          pkg-config --modversion grpc++ protobuf

      - name: Build
        run: make all

      - name: Run Unit tests
        run: make test-unit

      - name: Run Integration tests
        run: make test-integration
